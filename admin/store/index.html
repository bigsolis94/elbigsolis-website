<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Music Store Admin</title><style>body{background:#090909;color:#eee;font:16px system-ui;margin:0}main{max-width:850px;margin:auto;padding:24px}a{color:#f4cc39}article{background:#191919;border:1px solid #333;padding:20px;margin:15px 0;border-radius:12px}input,textarea{background:#080808;color:#fff;border:1px solid #555;padding:10px;border-radius:6px}textarea{display:block;width:95%;margin:8px 0}button{background:#f4cc39;border:0;padding:10px 18px;border-radius:8px;font-weight:bold}label{display:block;margin:12px 0}#token{width:min(95%,500px)}</style></head><body><main><a href="/admin/">← Dashboard</a><h1>Music Vault publishing</h1><p>Publish existing private uploads to your public Music Vault. Published songs can be streamed in full. Keep tracks unpublished until you're ready.</p><label>Admin token <input id="token" type="password" autocomplete="off"></label><button id="load">Load tracks</button><p id="status"></p><section id="list"></section></main><script>
const token=document.getElementById('token'),list=document.getElementById('list'),status=document.getElementById('status');const e=(t,txt)=>{const n=document.createElement(t);if(txt!==undefined)n.textContent=txt;return n};
document.getElementById('load').onclick=async()=>{status.textContent='Loading…';try{const r=await fetch('/api/admin/store',{headers:{Authorization:'Bearer '+token.value}});if(!r.ok)throw Error('Unauthorized or database migration missing');const d=await r.json();list.replaceChildren();status.textContent=d.tracks.length+' tracks';for(const t of d.tracks){const card=e('article'),title=e('h2',t.title),pub=e('input');pub.type='checkbox';pub.checked=!!t.published;const publabel=e('label','Publish to public Music Vault ');publabel.append(pub);const price=e('input');price.type='number';price.min='1';price.max='1000';price.step='.01';price.value=(Math.max(100,t.price_min_cents)/100).toFixed(2);const pl=e('label','Minimum download price (USD) ');pl.append(price);const desc=e('textarea');desc.value=t.description||'';desc.maxLength=500;desc.placeholder='Song description';const btn=e('button','Save');const msg=e('p');btn.onclick=async()=>{btn.disabled=true;try{const cents=Math.round(Number(price.value)*100);const r=await fetch('/api/admin/store',{method:'POST',headers:{Authorization:'Bearer '+token.value,'Content-Type':'application/json'},body:JSON.stringify({id:t.id,published:pub.checked,price_min_cents:cents,description:desc.value})});if(!r.ok)throw Error((await r.json()).error||'Save failed');msg.textContent='Saved!'}catch(err){msg.textContent=err.message}finally{btn.disabled=false}};card.append(title,e('p',t.filename),publabel,pl,desc,btn,msg);list.append(card)}}catch(err){status.textContent=err.message}};
</script></body></html>
