
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Music Vault | BIG SOLIS</title>
  <style>
    :root { color-scheme: dark; }
    body { background:#080808; color:#f5f3ef; font:16px system-ui; margin:0; }
    main { max-width:820px; margin:auto; padding:28px 18px; }
    a { color:#f4cc39; }
    header { display:flex; justify-content:space-between; align-items:center; }
    h1 { font-size:clamp(32px,6vw,56px); }
    article { background:#171717; border:1px solid #353535; border-radius:14px; padding:20px; margin:20px 0; }
    audio { width:100%; margin:12px 0; }
    input { background:#0b0b0b; color:white; border:1px solid #666; border-radius:8px; padding:12px; width:120px; }
    button { background:#f4cc39; color:black; border:0; padding:12px 18px; border-radius:8px; font-weight:bold; cursor:pointer; }
    button:disabled { opacity:.5; }
    .muted { color:#bdbdbd; }
    .msg { color:#f5d67c; }
  </style>
</head>
<body>
<main>
  <header>
    <b style="color:#f4cc39">BIG SOLIS STUDIO</b>
    <a href="/">Home</a>
  </header>

  <h1>Music Vault</h1>
  <p class="muted">Exclusive music. Stream for free. Downloads start at $1 — pay more if you want to support BIG SOLIS.</p>

  <p id="status" class="msg" role="status"></p>
  <section id="tracks">Loading tracks…</section>
</main>

<script>
const section = document.getElementById('tracks');
const status = document.getElementById('status');
const params = new URLSearchParams(location.search);
const paidSession = params.get('session_id');

const el = (tag, text) => {
  const x = document.createElement(tag);
  if (text !== undefined) x.textContent = text;
  return x;
};

async function verifyPayment() {
  if (!paidSession) return;

  status.textContent = 'Verifying your payment...';

  try {
    const r = await fetch(
      '/api/studio/receipt?session_id=' +
      encodeURIComponent(paidSession),
      { cache: 'no-store' }
    );

    if (!r.ok) {
      const message = await r.text();
      throw new Error(
        'Payment verification failed (' + r.status + '): ' + message
      );
    }

    const d = await r.json();

    if (!Number.isSafeInteger(d.id) || d.id < 1 || !d.grant) {
      throw new Error('Download authorization was not returned.');
    }

    status.textContent =
      'Thank you for supporting BIG SOLIS! Your download is ready. ';

    const link = el('a', 'Download Your Song');
    link.href =
      '/api/studio/download?id=' +
      encodeURIComponent(d.id) +
      '&grant=' +
      encodeURIComponent(d.grant);

    link.setAttribute('download', '');
    status.append(link);

    // Remove the Stripe session from the address bar
    // only after verification succeeds.
    history.replaceState(null, '', location.pathname);

  } catch (e) {
    status.textContent = e.message;
  }
}

async function load() {
  try {
    const r = await fetch('/api/studio/catalog');

    if (!r.ok) throw Error('Catalog unavailable');

    const data = await r.json();
    section.replaceChildren();

    if (!data.tracks.length) {
      section.textContent = 'No public tracks yet. Check back soon.';
    }

    for (const t of data.tracks) {
      const a = el('article');
      const h = el('h2', t.title);
      const desc = el('p', t.description || 'BIG SOLIS exclusive');

      const audio = el('audio');
      audio.controls = true;
      
let playRecorded = false;

audio.addEventListener('playing', () => {
  if (playRecorded) return;

  playRecorded = true;

  fetch('/api/studio/play', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({id: t.id})
  }).catch(() => {
    playRecorded = false;
  });
});

      audio.preload = 'none';
      audio.src = '/api/studio/audio?id=' + t.id;

      const minimum = Math.max(100, t.price_min_cents);
      const p = el(
        'p',
        'Minimum download: $' + (minimum / 100).toFixed(2)
      );
      p.className = 'muted';

      const label = el('label', 'Your price (USD): ');
      const inp = el('input');

      inp.type = 'number';
      inp.min = (minimum / 100).toFixed(2);
      inp.max = '1000';
      inp.step = '0.01';
      inp.value = (minimum / 100).toFixed(2);

      const btn = el('button', 'Download / Support');
      const feedback = el('p');
      feedback.className = 'msg';

      btn.onclick = async () => {
        const cents = Math.round(Number(inp.value) * 100);

        if (
          !Number.isSafeInteger(cents) ||
          cents < minimum ||
          cents > 100000
        ) {
          feedback.textContent =
            'Enter an amount at or above the minimum, up to $1,000.';
          return;
        }

        btn.disabled = true;
        feedback.textContent = 'Opening secure checkout...';

        try {
          const r = await fetch('/api/studio/checkout', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              id: t.id,
              amount_cents: cents
            })
          });

          const d = await r.json();

          if (!r.ok) {
            throw Error(d.error || 'Checkout failed');
          }

          if (!d.url) {
            throw Error('Checkout URL was not returned.');
          }

          location.href = d.url;

        } catch (e) {
          feedback.textContent = e.message;
          btn.disabled = false;
        }
      };

      label.append(inp);
      a.append(
        h,
        desc,
        audio,
        p,
        label,
        el('span', ' '),
        btn,
        feedback
      );

      section.append(a);
    }

  } catch (e) {
    section.textContent = e.message;
  }
}

load();
verifyPayment();
</script>
</body>
</html>
